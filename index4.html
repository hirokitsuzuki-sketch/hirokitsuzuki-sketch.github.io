<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>漢字マスター｜4年生の202字</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Serif+JP:wght@400;700&display=swap');

  :root {
    --bg:#0f1117; --bg2:#161923; --bg3:#1e2433;
    --card:#1a2035; --card2:#202840;
    --accent:#4f9eff; --accent2:#7b5ea7; --accent3:#e85d75;
    --gold:#f0c040; --green:#3ecf8e;
    --text:#e8eaf6; --text2:#8892b0; --text3:#ccd6f6;
    --border:rgba(79,158,255,0.15);
    --shadow:0 8px 32px rgba(0,0,0,0.4);
    --r:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Zen Kaku Gothic New',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
  #stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse at 20% 50%,rgba(79,158,255,0.04) 0%,transparent 60%),
               radial-gradient(ellipse at 80% 20%,rgba(123,94,167,0.04) 0%,transparent 60%)}
  #app{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:0 16px 80px}

  header{padding:28px 0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);margin-bottom:24px}
  .logo{display:flex;align-items:center;gap:10px}
  .logo-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:white;flex-shrink:0}
  .logo-text{font-size:18px;font-weight:700;color:var(--text3)}
  .logo-sub{font-size:11px;color:var(--text2);margin-top:1px}
  .progress-global{text-align:right}
  .progress-global .pct{font-size:24px;font-weight:900;color:var(--accent)}
  .progress-global .lbl{font-size:10px;color:var(--text2)}

  .screen{display:none}
  .screen.active{display:block}

  .hero{text-align:center;padding:40px 16px 32px}
  .hero h1{font-size:clamp(26px,5.5vw,44px);font-weight:900;line-height:1.2;background:linear-gradient(135deg,var(--text3),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
  .hero p{color:var(--text2);font-size:14px;line-height:1.7}

  .tab-bar{display:flex;gap:8px;margin-bottom:24px;background:var(--bg2);border-radius:12px;padding:6px}
  .tab-btn{flex:1;padding:10px;border:none;background:transparent;color:var(--text2);font-family:inherit;font-size:13px;font-weight:600;border-radius:8px;cursor:pointer;transition:all 0.2s}
  .tab-btn.active{background:var(--card2);color:var(--text3);box-shadow:0 2px 8px rgba(0,0,0,0.3)}

  .cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .cat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;cursor:pointer;transition:all 0.25s;position:relative;overflow:hidden}
  .cat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r) var(--r) 0 0}
  .cat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:rgba(79,158,255,0.3)}
  .cat-card:active{transform:scale(0.98)}
  .cat-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .cat-emoji{font-size:24px}
  .cat-name{font-size:15px;font-weight:700;color:var(--text3)}
  .cat-count{font-size:11px;color:var(--text2);margin-top:1px}
  .cat-bar-wrap{background:rgba(255,255,255,0.06);border-radius:4px;height:6px;overflow:hidden}
  .cat-bar{height:100%;border-radius:4px;transition:width 0.6s ease}
  .cat-score{font-size:11px;color:var(--text2);margin-top:6px;display:flex;justify-content:space-between}

  .cc0::before{background:linear-gradient(90deg,#4f9eff,#7b5ea7)} .cc0 .cat-bar{background:linear-gradient(90deg,#4f9eff,#7b5ea7)}
  .cc1::before{background:linear-gradient(90deg,#e85d75,#f0a060)} .cc1 .cat-bar{background:linear-gradient(90deg,#e85d75,#f0a060)}
  .cc2::before{background:linear-gradient(90deg,#3ecf8e,#4f9eff)} .cc2 .cat-bar{background:linear-gradient(90deg,#3ecf8e,#4f9eff)}
  .cc3::before{background:linear-gradient(90deg,#f0c040,#e85d75)} .cc3 .cat-bar{background:linear-gradient(90deg,#f0c040,#e85d75)}
  .cc4::before{background:linear-gradient(90deg,#7b5ea7,#3ecf8e)} .cc4 .cat-bar{background:linear-gradient(90deg,#7b5ea7,#3ecf8e)}
  .cc5::before{background:linear-gradient(90deg,#4f9eff,#3ecf8e)} .cc5 .cat-bar{background:linear-gradient(90deg,#4f9eff,#3ecf8e)}
  .cc6::before{background:linear-gradient(90deg,#e85d75,#7b5ea7)} .cc6 .cat-bar{background:linear-gradient(90deg,#e85d75,#7b5ea7)}
  .cc7::before{background:linear-gradient(90deg,#f0c040,#4f9eff)} .cc7 .cat-bar{background:linear-gradient(90deg,#f0c040,#4f9eff)}
  .cc8::before{background:linear-gradient(90deg,#3ecf8e,#f0c040)} .cc8 .cat-bar{background:linear-gradient(90deg,#3ecf8e,#f0c040)}
  .cc9::before{background:linear-gradient(90deg,#7b5ea7,#e85d75)} .cc9 .cat-bar{background:linear-gradient(90deg,#7b5ea7,#e85d75)}

  .kanji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:10px}
  .kanji-chip{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 4px;text-align:center;cursor:pointer;transition:all 0.2s}
  .kanji-chip:hover{border-color:var(--accent);transform:scale(1.05)}
  .kanji-char{font-family:'Noto Serif JP',serif;font-size:22px;display:block;margin-bottom:3px}
  .kanji-read{font-size:9px;color:var(--text2)}
  .kanji-chip.learned{border-color:var(--green);background:rgba(62,207,142,0.08)}
  .kanji-chip.learned .kanji-char{color:var(--green)}

  .quiz-header{display:flex;align-items:center;gap:14px;margin-bottom:20px;padding-top:16px}
  .back-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;transition:all 0.2s;flex-shrink:0}
  .back-btn:hover{color:var(--text);border-color:var(--accent)}
  .quiz-title{font-size:15px;font-weight:700;color:var(--text3)}
  .quiz-subtitle{font-size:11px;color:var(--text2);margin-top:2px}
  .quiz-progress{margin-left:auto;text-align:right}
  .qnum{font-size:13px;font-weight:700;color:var(--accent)}
  .qof{font-size:11px;color:var(--text2)}

  .prog-bar-wrap{background:rgba(255,255,255,0.06);border-radius:8px;height:8px;overflow:hidden;margin-bottom:24px}
  .prog-bar{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 0.5s ease}

  .mode-toggle{display:flex;gap:8px;margin-bottom:20px;justify-content:flex-end}
  .mode-btn{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s}
  .mode-btn.active{background:var(--accent);color:white;border-color:var(--accent)}

  .questions-list{display:flex;flex-direction:column;gap:14px}
  .q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;transition:all 0.3s;position:relative}
  .q-card.answered-correct{border-color:rgba(62,207,142,0.4);background:rgba(62,207,142,0.04)}
  .q-card.answered-wrong{border-color:rgba(232,93,117,0.4);background:rgba(232,93,117,0.04)}
  .q-num{font-size:11px;color:var(--text2);margin-bottom:8px;font-weight:600;letter-spacing:0.5px}
  .q-sentence{font-size:clamp(15px,3.5vw,18px);line-height:1.9;color:var(--text3);font-weight:500;margin-bottom:14px}
  .q-blank{display:inline-block;min-width:2.2em;text-align:center;border-bottom:2px solid var(--accent);padding:0 4px;color:var(--accent);font-weight:700}
  .q-hint{font-size:11px;color:var(--text2);margin-bottom:14px}

  .canvas-wrap{background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:10px;padding:10px;display:none;margin-bottom:10px}
  .canvas-wrap.show{display:block}
  .canvas-toolbar{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .canvas-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-family:inherit;font-size:11px;cursor:pointer;transition:all 0.2s}
  .canvas-btn:hover{color:var(--text)}
  .canvas-btn.eraser-active{background:var(--accent2);color:white;border-color:var(--accent2)}
  canvas.writing-canvas{width:100%;height:120px;background:rgba(255,255,255,0.03);border-radius:8px;cursor:crosshair;display:block;touch-action:none}

  .answer-section{display:none;padding:12px;background:rgba(255,255,255,0.03);border-radius:10px}
  .answer-section.show{display:block}
  .answer-label{font-size:11px;color:var(--text2);margin-bottom:6px;font-weight:600;letter-spacing:0.5px}
  .answer-kanji{font-family:'Noto Serif JP',serif;font-size:32px;color:var(--gold);font-weight:700;line-height:1.2;margin-bottom:4px}
  .answer-meta{font-size:12px;color:var(--text2);line-height:1.7}
  .answer-meta span{color:var(--text3)}

  .self-check{display:none;margin-top:12px;gap:10px}
  .self-check.show{display:flex}
  .sc-btn{flex:1;padding:10px;border-radius:10px;border:none;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s}
  .sc-correct{background:rgba(62,207,142,0.15);color:var(--green);border:1px solid rgba(62,207,142,0.3)}
  .sc-wrong{background:rgba(232,93,117,0.15);color:var(--accent3);border:1px solid rgba(232,93,117,0.3)}
  .sc-correct:hover{background:rgba(62,207,142,0.25)}
  .sc-wrong:hover{background:rgba(232,93,117,0.25)}
  .result-badge{position:absolute;top:14px;right:16px;font-size:18px;display:none}
  .result-badge.show{display:block}

  .quiz-actions{margin-top:24px;display:flex;flex-direction:column;gap:12px}
  .reveal-btn{width:100%;padding:16px;border-radius:12px;border:none;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.2s;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white}
  .reveal-btn:hover{opacity:0.9;transform:translateY(-1px)}
  .reveal-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}
  .reveal-btn.revealed{background:linear-gradient(135deg,var(--green),#2fa870)}

  .results-hero{text-align:center;padding:32px 16px 24px}
  .results-score{font-size:clamp(56px,15vw,80px);font-weight:900;line-height:1;background:linear-gradient(135deg,var(--gold),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
  .results-label{font-size:14px;color:var(--text2);margin-bottom:20px}
  .results-msg{font-size:18px;font-weight:700;color:var(--text3);margin-bottom:8px}
  .results-sub{font-size:13px;color:var(--text2)}
  .results-actions{display:flex;gap:12px;margin-top:24px}
  .res-btn{flex:1;padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s}
  .res-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;border-color:transparent}
  .res-btn:hover{opacity:0.85}

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:100;align-items:center;justify-content:center;padding:20px}
  .modal-overlay.show{display:flex}
  .modal{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:28px;max-width:400px;width:100%;box-shadow:0 24px 64px rgba(0,0,0,0.6);animation:modalIn 0.25s ease}
  @keyframes modalIn{from{opacity:0;transform:scale(0.92) translateY(10px)}to{opacity:1;transform:none}}
  .modal-kanji{font-family:'Noto Serif JP',serif;font-size:72px;text-align:center;line-height:1;color:var(--gold);margin-bottom:12px}
  .modal-read{text-align:center;font-size:16px;color:var(--accent);font-weight:700;margin-bottom:6px}
  .modal-meaning{text-align:center;font-size:13px;color:var(--text2);margin-bottom:20px}
  .modal-examples{background:var(--bg3);border-radius:10px;padding:14px;margin-bottom:16px}
  .modal-ex-title{font-size:11px;color:var(--text2);margin-bottom:8px;font-weight:600;letter-spacing:0.5px}
  .modal-ex-item{font-size:13px;color:var(--text3);line-height:1.8}
  .modal-close{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text2);font-family:inherit;font-size:14px;cursor:pointer;transition:all 0.2s}
  .modal-close:hover{background:var(--card);color:var(--text)}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px 20px;font-size:13px;font-weight:600;color:var(--text3);z-index:200;transition:transform 0.3s ease;white-space:nowrap;box-shadow:var(--shadow)}
  .toast.show{transform:translateX(-50%) translateY(0)}

  .section-head{font-size:12px;font-weight:700;color:var(--text2);letter-spacing:1px;text-transform:uppercase;margin:28px 0 14px;display:flex;align-items:center;gap:10px}
  .section-head::after{content:'';flex:1;height:1px;background:var(--border)}
  .review-tag{display:inline-block;background:rgba(240,192,64,0.15);color:var(--gold);border:1px solid rgba(240,192,64,0.3);border-radius:6px;padding:2px 8px;font-size:10px;font-weight:700;margin-left:8px;vertical-align:middle}

  @media(max-width:520px){.cat-grid{grid-template-columns:1fr 1fr}.kanji-grid{grid-template-columns:repeat(auto-fill,minmax(50px,1fr))}.modal-kanji{font-size:60px}}
  @media(max-width:360px){.cat-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="stars"></div>
<div id="app">
  <header>
    <div class="logo">
      <div class="logo-icon">字</div>
      <div>
        <div class="logo-text">漢字マスター</div>
        <div class="logo-sub">小学4年生・202字</div>
      </div>
    </div>
    <div class="progress-global">
      <div class="pct" id="globalPct">0%</div>
      <div class="lbl">全体進捗</div>
    </div>
  </header>

  <div id="screen-home" class="screen active">
    <div class="hero">
      <h1>4年生の漢字を<br>完全マスター！</h1>
      <p>202字を文章問題で練習して、正しく書けるようになろう。<br>10のカテゴリで少しずつ進めていこう。</p>
    </div>
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('quiz')">📝 問題練習</button>
      <button class="tab-btn" onclick="switchTab('list')">📚 漢字一覧</button>
    </div>
    <div id="tab-quiz">
      <div class="section-head">カテゴリを選ぼう</div>
      <div class="cat-grid" id="catGrid"></div>
    </div>
    <div id="tab-list" style="display:none">
      <div class="section-head">習った漢字をチェック</div>
      <div class="kanji-grid" id="kanjiGrid"></div>
    </div>
  </div>

  <div id="screen-quiz" class="screen">
    <div class="quiz-header">
      <button class="back-btn" onclick="goHome()">←</button>
      <div>
        <div class="quiz-title" id="quizTitle"></div>
        <div class="quiz-subtitle" id="quizSubtitle"></div>
      </div>
      <div class="quiz-progress">
        <div class="qnum" id="qNum"></div>
        <div class="qof" id="qOf"></div>
      </div>
    </div>
    <div class="prog-bar-wrap"><div class="prog-bar" id="progBar" style="width:0%"></div></div>
    <div class="mode-toggle">
      <button class="mode-btn active" id="modeBtn0" onclick="setMode(0)">📝 紙に書く</button>
      <button class="mode-btn" id="modeBtn1" onclick="setMode(1)">✏️ 画面に書く</button>
    </div>
    <div class="questions-list" id="questionsList"></div>
    <div class="quiz-actions">
      <button class="reveal-btn" id="revealBtn" onclick="revealAnswers()">📋 答え合わせ</button>
    </div>
  </div>

  <div id="screen-results" class="screen">
    <div class="results-hero">
      <div class="results-score" id="resScore"></div>
      <div class="results-label" id="resLabel"></div>
      <div class="results-msg" id="resMsg"></div>
      <div class="results-sub" id="resSub"></div>
    </div>
    <div class="results-actions">
      <button class="res-btn" onclick="goHome()">🏠 ホームへ</button>
      <button class="res-btn primary" onclick="retryQuiz()">🔄 もう一度</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-kanji" id="modalKanji"></div>
    <div class="modal-read" id="modalRead"></div>
    <div class="modal-meaning" id="modalMeaning"></div>
    <div class="modal-examples">
      <div class="modal-ex-title">使い方の例</div>
      <div class="modal-ex-item" id="modalEx"></div>
    </div>
    <button class="modal-close" onclick="closeModal()">閉じる</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
// 漢字辞書: 4年生202字 (読み, 意味, 使用例)
// ============================================================
const KANJI_DATA = {
  "愛":["あい","大切に思う気持ち","愛する・愛情"],
  "案":["あん","考え・計画","案内・提案"],
  "以":["い","〜より・〜から","以上・以外"],
  "衣":["い・ころも","着るもの","衣服・衣類"],
  "位":["い・くらい","位置・地位","順位・上位"],
  "印":["いん・しるし","しるし","印刷・目印"],
  "英":["えい","すぐれた・英語","英語・英雄"],
  "栄":["えい・さかえる","栄えること","栄養・繁栄"],
  "塩":["えん・しお","塩のこと","塩分・食塩"],
  "億":["おく","一万の一万倍","億・一億"],
  "加":["か・くわえる","加えること","加える・参加"],
  "果":["か・はて","くだもの・結果","結果・果物"],
  "貨":["か","お金・荷物","貨物・金貨"],
  "課":["か","課題・仕事の区分","課題・授業料"],
  "改":["かい・あらためる","改めること","改める・改善"],
  "械":["かい","機械のこと","機械・器械"],
  "害":["がい","傷つけること","害虫・被害"],
  "街":["がい・まち","町・商店街","商店街・街中"],
  "各":["かく・おのおの","それぞれ","各自・各地"],
  "覚":["かく・おぼえる","覚えること","覚える・感覚"],
  "完":["かん","完全なこと","完成・完了"],
  "官":["かん","役人・役所","官庁・長官"],
  "管":["かん・くだ","管のこと・管理","管理・血管"],
  "観":["かん・みる","見ること・考え","観察・観客"],
  "関":["かん・せき","関係すること","関係・関心"],
  "願":["がん・ねがう","お願いすること","願う・願書"],
  "希":["き","希望すること","希望・希少"],
  "季":["き","季節のこと","季節・四季"],
  "旗":["き・はた","旗のこと","国旗・旗手"],
  "器":["き","道具・器","器具・食器"],
  "機":["き","機械・機会","機会・飛行機"],
  "議":["ぎ","話し合うこと","会議・議員"],
  "求":["きゅう・もとめる","求めること","求める・要求"],
  "泣":["きゅう・なく","泣くこと","泣く・号泣"],
  "給":["きゅう","与えること","給食・給料"],
  "挙":["きょ・あげる","上げること・例として出す","挙げる・選挙"],
  "漁":["ぎょ・りょう","魚をとること","漁業・漁師"],
  "共":["きょう・とも","いっしょに","共同・公共"],
  "協":["きょう","協力すること","協力・協議"],
  "鏡":["きょう・かがみ","鏡のこと","鏡・眼鏡"],
  "競":["きょう・きそう","競い合うこと","競争・競技"],
  "極":["きょく・きわめる","きわまること","極端・南極"],

// ============================================================
// STATE
// ============================================================
let state = {
  currentCat:null, currentQuestions:[], revealed:false,
  scores:{}, learnedKanji:new Set(), writingMode:0, eraserMode:{}
};
let answeredCount=0, correctCount=0;

// ============================================================
// INIT
// ============================================================
window.addEventListener('DOMContentLoaded', () => {
  loadState(); renderCatGrid(); renderKanjiGrid(); updateGlobalProgress();
});

function loadState() {
  try {
    const s = localStorage.getItem('kanji4_state');
    if (s) {
      const p = JSON.parse(s);
      if (p.scores)       state.scores = p.scores;
      if (p.learnedKanji) state.learnedKanji = new Set(p.learnedKanji);
    }
  } catch(e) {}
}

function saveState() {
  try {
    localStorage.setItem('kanji4_state', JSON.stringify({
      scores: state.scores,
      learnedKanji: Array.from(state.learnedKanji)
    }));
  } catch(e) {}
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i) =>
    b.classList.toggle('active',(i===0&&tab==='quiz')||(i===1&&tab==='list')));
  document.getElementById('tab-quiz').style.display = tab==='quiz'?'block':'none';
  document.getElementById('tab-list').style.display = tab==='list'?'block':'none';
}

function renderCatGrid() {
  document.getElementById('catGrid').innerHTML = CATEGORIES.map(cat => {
    const sc=state.scores[cat.id]||{correct:0,total:0};
    const total=ALL_QUESTIONS.filter(q=>q.cat===cat.id).length;
    const barW=sc.total>0?(sc.correct/sc.total*100):0;
    const pct=sc.total>0?Math.round(sc.correct/sc.total*100):0;
    return `<div class="cat-card ${cat.color}" onclick="startQuiz(${cat.id})">
      <div class="cat-header"><span class="cat-emoji">${cat.emoji}</span>
        <div><div class="cat-name">${cat.name}</div><div class="cat-count">${total}問</div></div>
      </div>
      <div class="cat-bar-wrap"><div class="cat-bar" style="width:${barW}%"></div></div>
      <div class="cat-score">
        <span>${sc.total>0?sc.correct+'問正解 / '+sc.total+'問':'未挑戦'}</span>
        <span>${sc.total>0?pct+'%':''}</span>
      </div></div>`;
  }).join('');
}

function renderKanjiGrid() {
  const all=Array.from(new Set(ALL_QUESTIONS.map(q=>q.ans))).sort();
  document.getElementById('kanjiGrid').innerHTML = all.map(k => {
    const d=KANJI_DATA[k]; const learned=state.learnedKanji.has(k);
    return `<div class="kanji-chip ${learned?'learned':''}" onclick="showKanjiModal('${k}')">
      <span class="kanji-char">${k}</span>
      <span class="kanji-read">${d?d[0].split('・')[0]:''}</span></div>`;
  }).join('');
}

function startQuiz(catId) {
  state.currentCat=catId;
  state.currentQuestions=ALL_QUESTIONS.filter(q=>q.cat===catId);
  state.revealed=false; state.eraserMode={}; state.writingMode=0;
  answeredCount=0; correctCount=0;
  const cat=CATEGORIES[catId];
  document.getElementById('quizTitle').textContent=cat.emoji+' '+cat.name;
  document.getElementById('quizSubtitle').textContent=`${state.currentQuestions.length}問のチャレンジ`;
  document.getElementById('qNum').textContent=state.currentQuestions.length+'問';
  document.getElementById('qOf').textContent='全問';
  document.getElementById('progBar').style.width='0%';
  renderQuestions(); showScreen('quiz'); window.scrollTo(0,0);
}

function retryQuiz() { if(state.currentCat!==null) startQuiz(state.currentCat); }

function renderQuestions() {
  document.getElementById('questionsList').innerHTML = state.currentQuestions.map((q,i) => {
    const sentence=q.q.replace('〔　〕',`<span class="q-blank" id="blank-${i}">　　</span>`);
    const rev=q.review?`<span class="review-tag">復習</span>`:'';
    return `<div class="q-card" id="qcard-${i}">
      <span class="result-badge" id="badge-${i}"></span>
      <div class="q-num">問${i+1}${rev}</div>
      <div class="q-sentence">${sentence}</div>
      <div class="q-hint">ヒント：${q.hint}</div>
      <div class="canvas-wrap" id="cwrap-${i}">
        <div class="canvas-toolbar">
          <button class="canvas-btn" id="eraser-${i}" onclick="toggleEraser(${i})">消しゴム</button>
          <button class="canvas-btn" onclick="clearCanvas(${i})">全消去</button>
          <span style="font-size:11px;color:var(--text2);align-self:center">指やマウスで書いてみよう</span>
        </div>
        <canvas class="writing-canvas" id="canvas-${i}" width="600" height="120"></canvas>
      </div>
      <div class="answer-section" id="ans-${i}">
        <div class="answer-label">正解</div>
        <div class="answer-kanji">${q.ans}</div>
        <div class="answer-meta">${getAnswerMeta(q.ans)}</div>
      </div>
      <div class="self-check" id="check-${i}">
        <button class="sc-btn sc-correct" onclick="markAnswer(${i},true)">⭕ 正解！</button>
        <button class="sc-btn sc-wrong" onclick="markAnswer(${i},false)">✕ まちがえた</button>
      </div></div>`;
  }).join('');
  const btn=document.getElementById('revealBtn');
  btn.textContent='📋 答え合わせ'; btn.className='reveal-btn'; btn.disabled=false;
  requestAnimationFrame(() => {
    state.currentQuestions.forEach((_,i)=>initCanvas(i));
    applyMode(state.writingMode);
  });
}

function getAnswerMeta(kanji) {
  const d=KANJI_DATA[kanji]; if(!d) return '';
  return `読み：<span>${d[0]}</span><br>意味：<span>${d[1]}</span><br>使い方：<span>${d[2]}</span>`;
}

function setMode(m) {
  state.writingMode=m;
  document.getElementById('modeBtn0').classList.toggle('active',m===0);
  document.getElementById('modeBtn1').classList.toggle('active',m===1);
  applyMode(m);
}
function applyMode(m) {
  state.currentQuestions.forEach((_,i)=>{
    const cw=document.getElementById('cwrap-'+i);
    if(cw) cw.classList.toggle('show',m===1);
  });
}

function initCanvas(i) {
  const canvas=document.getElementById('canvas-'+i); if(!canvas) return;
  const ctx=canvas.getContext('2d');
  ctx.strokeStyle='#e8eaf6'; ctx.lineWidth=3; ctx.lineCap='round'; ctx.lineJoin='round';
  let drawing=false;
  function getPos(e){
    const r=canvas.getBoundingClientRect();
    const sx=canvas.width/r.width, sy=canvas.height/r.height;
    const s=e.touches?e.touches[0]:e;
    return{x:(s.clientX-r.left)*sx,y:(s.clientY-r.top)*sy};
  }
  function startDraw(e){e.preventDefault();drawing=true;const p=getPos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)}
  function draw(e){
    e.preventDefault();if(!drawing)return;const p=getPos(e);
    if(state.eraserMode[i]){ctx.globalCompositeOperation='destination-out';ctx.lineWidth=20}
    else{ctx.globalCompositeOperation='source-over';ctx.lineWidth=3;ctx.strokeStyle='#e8eaf6'}
    ctx.lineTo(p.x,p.y);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x,p.y);
  }
  function endDraw(e){if(e)e.preventDefault();drawing=false;ctx.globalCompositeOperation='source-over';ctx.lineWidth=3}
  canvas.addEventListener('mousedown',startDraw);canvas.addEventListener('mousemove',draw);
  canvas.addEventListener('mouseup',endDraw);canvas.addEventListener('mouseleave',endDraw);
  canvas.addEventListener('touchstart',startDraw,{passive:false});
  canvas.addEventListener('touchmove',draw,{passive:false});
  canvas.addEventListener('touchend',endDraw,{passive:false});
}
function toggleEraser(i){
  state.eraserMode[i]=!state.eraserMode[i];
  const b=document.getElementById('eraser-'+i);
  if(b) b.classList.toggle('eraser-active',state.eraserMode[i]);
}
function clearCanvas(i){
  const c=document.getElementById('canvas-'+i);
  if(c) c.getContext('2d').clearRect(0,0,c.width,c.height);
}

function revealAnswers(){
  state.revealed=true;
  state.currentQuestions.forEach((_,i)=>{
    document.getElementById('ans-'+i).classList.add('show');
    document.getElementById('check-'+i).classList.add('show');
  });
  const btn=document.getElementById('revealBtn');
  btn.textContent='✅ 答えを確認中…'; btn.className='reveal-btn revealed'; btn.disabled=true;
  document.getElementById('progBar').style.width='30%';
  showToast('答えと照らし合わせて自己採点してね！');
}

function markAnswer(i,correct){
  const card=document.getElementById('qcard-'+i);
  const badge=document.getElementById('badge-'+i);
  const check=document.getElementById('check-'+i);
  if(card.classList.contains('answered-correct')||card.classList.contains('answered-wrong')) return;
  card.classList.add(correct?'answered-correct':'answered-wrong');
  badge.textContent=correct?'⭕':'✕'; badge.classList.add('show');
  check.style.opacity='0.4'; check.style.pointerEvents='none';
  answeredCount++; if(correct){correctCount++;state.learnedKanji.add(state.currentQuestions[i].ans);}
  const pct=30+(answeredCount/state.currentQuestions.length)*70;
  document.getElementById('progBar').style.width=pct+'%';
  if(answeredCount===state.currentQuestions.length){
    state.scores[state.currentCat]={correct:correctCount,total:answeredCount};
    saveState();
    setTimeout(()=>showResults(correctCount,answeredCount),400);
  }
}

function showResults(correct,total){
  const pct=Math.round(correct/total*100);
  document.getElementById('resScore').textContent=pct+'%';
  document.getElementById('resLabel').textContent=`${correct} / ${total} 問正解`;
  let msg,sub;
  if(pct===100){msg='🎉 全問正解！すごい！';sub='パーフェクト！次のカテゴリにもチャレンジしよう！'}
  else if(pct>=80){msg='🌟 よくできました！';sub='もう少しで完璧！もう一度やってみよう。'}
  else if(pct>=60){msg='👍 がんばりました！';sub='まちがえた漢字を確認してもう一度練習しよう。'}
  else{msg='📖 もう少しがんばろう！';sub='まちがえた問題を中心に練習しよう。'}
  document.getElementById('resMsg').textContent=msg;
  document.getElementById('resSub').textContent=sub;
  answeredCount=0; correctCount=0;
  showScreen('results'); updateGlobalProgress(); renderCatGrid(); renderKanjiGrid();
}

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  window.scrollTo(0,0);
}
function goHome(){answeredCount=0;correctCount=0;showScreen('home');updateGlobalProgress();renderCatGrid();}
function updateGlobalProgress(){
  const totalQ=ALL_QUESTIONS.length;
  let totalC=0; Object.values(state.scores).forEach(sc=>totalC+=sc.correct);
  document.getElementById('globalPct').textContent=totalQ>0?Math.round(totalC/totalQ*100)+'%':'0%';
}

function showKanjiModal(kanji){
  const d=KANJI_DATA[kanji];
  document.getElementById('modalKanji').textContent=kanji;
  document.getElementById('modalRead').textContent=d?d[0]:kanji;
  document.getElementById('modalMeaning').textContent=d?d[1]:'';
  document.getElementById('modalEx').textContent=d?d[2]:'';
  document.getElementById('modal').classList.add('show');
}
function closeModal(e){
  if(!e||e.target.id==='modal'||e.target.classList.contains('modal-close'))
    document.getElementById('modal').classList.remove('show');
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
