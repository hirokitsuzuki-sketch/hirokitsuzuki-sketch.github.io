<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#12141f">
<title>柊くんの かんじの塔｜漢字タワーディフェンス</title>
<link rel="stylesheet" href="css/style.css?v=20260707a">
</head>
<body>

<div id="app">

  <!-- ===== ホーム画面 ===== -->
  <div id="screen-home" class="screen"></div>

  <!-- ===== ゲーム画面 ===== -->
  <div id="screen-game" class="screen hidden">
    <div id="hud-top">
      <button id="btn-quit" class="hud-btn" title="やめる">🏠</button>
      <div class="hud-stat" id="hud-life" title="きょてんHP">❤️ <span>20</span></div>
      <div class="hud-stat" id="hud-coin" title="コイン">🪙 <span>0</span></div>
      <div class="hud-stat" id="hud-wave" title="ウェーブ">🌊 <span>1/8</span></div>
      <div class="hud-combo" id="hud-combo"><span class="combo-num">0</span><span class="combo-label">COMBO</span></div>
      <div class="hud-right">
        <button id="btn-speed" class="hud-btn" title="はやさ">▶ x1</button>
        <button id="btn-pause" class="hud-btn" title="いちじていし">⏸</button>
      </div>
    </div>

    <div id="canvas-wrap">
      <canvas id="game-canvas"></canvas>
      <div id="wave-banner" class="hidden"></div>
      <div id="combo-banner" class="hidden"></div>
      <!-- タワー操作ポップアップ（canvas-wrap基準で配置） -->
      <div id="tower-popup" class="hidden"></div>
      <!-- ウェーブ開始ボタン（キャンバス上に浮かせて下部バーのレイアウトを崩さない） -->
      <button id="btn-next-wave" class="big-btn wave-btn hidden">⚔️ つぎのウェーブ</button>
    </div>

    <div id="hud-bottom">
      <div id="tower-palette"></div>
      <div id="skill-area">
        <div id="skill-gauge"><div id="skill-gauge-fill"></div><span id="skill-gauge-label">スキル</span></div>
        <button id="btn-skill" class="big-btn skill-btn" disabled>✨ スキル</button>
      </div>
    </div>

  </div>

  <!-- ===== モーダル（クイズ・結果・図鑑など） ===== -->
  <div id="modal-layer" class="hidden"></div>

</div>

<!-- データ -->
<script src="js/data/questions-data.js?v=20260707a"></script>
<script src="js/data/questions-data-extra.js?v=20260707a"></script>
<script src="js/data/towers.js?v=20260707a"></script>
<script src="js/data/enemies.js?v=20260707a"></script>
<script src="js/data/skills.js?v=20260707a"></script>
<script src="js/data/stages.js?v=20260707a"></script>
<script src="js/data/meta.js?v=20260707a"></script>
<!-- コア -->
<script src="js/core/save.js?v=20260707a"></script>
<script src="js/core/sfx.js?v=20260707a"></script>
<script src="js/core/bgm.js?v=20260707a"></script>
<script src="js/core/quiz.js?v=20260707a"></script>
<!-- ゲーム本体 -->
<script src="js/game/effects.js?v=20260707a"></script>
<script src="js/game/entities.js?v=20260707a"></script>
<script src="js/game/game.js?v=20260707a"></script>
<!-- UI -->
<script src="js/ui/screens.js?v=20260707a"></script>
<script src="js/main.js?v=20260707a"></script>

</body>
</html>
