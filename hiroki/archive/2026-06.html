      return '<a class="card" href="' + escapeHtml(it.url) + '" target="_blank" rel="noopener noreferrer">' +
        '<div class="meta">' +
          '<span class="badge">' + escapeHtml(labels[it.category] || it.category) + '</span>' +
          '<span class="stars">' + stars(it.importance) + '</span>' +
          '<span>' + escapeHtml(it.sourceName) + '</span>' +
          '<span>' + dateStr + '</span>' +
        '</div>' +
        '<h3>' + escapeHtml(it.title) + '</h3>' +
        '<p>' + escapeHtml(it.summary) + '</p>' +
      '</a>';
    }).join('');

    countEl.textContent = filtered.length + ' 件';
    emptyEl.style.display = filtered.length === 0 ? 'block' : 'none';
  }

  searchBox.addEventListener('input', render);
  sortSelect.addEventListener('change', render);
  chips.forEach(function (chip) {
    chip.addEventListener('click', function () {
      chips.forEach(function (c) { c.classList.remove('active'); });
      chip.classList.add('active');
      activeCategory = chip.dataset.category;
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
