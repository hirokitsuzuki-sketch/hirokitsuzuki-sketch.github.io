<style>

<script>
(function () {
  var root = document.documentElement;
  var saved = localStorage.getItem('ainews_theme');
  if (saved) root.setAttribute('data-theme', saved);
  document.getElementById('themeToggle').addEventListener('click', function () {
    var current = root.getAttribute('data-theme')
      || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var next = current === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('ainews_theme', next);
  });

  var listEl = document.getElementById('newsList');
  if (!listEl) return;

  var items = JSON.parse(document.getElementById('news-data').textContent);
  var labels = JSON.parse(document.getElementById('category-labels').textContent);
  var searchBox = document.getElementById('searchBox');
  var sortSelect = document.getElementById('sortSelect');
  var chips = document.querySelectorAll('.chip');
  var countEl = document.getElementById('count');
  var emptyEl = document.getElementById('empty');
  var activeCategory = 'all';

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function stars(n) {
    return '★'.repeat(n) + '☆'.repeat(5 - n);
  }

  function render() {
    var q = searchBox.value.trim().toLowerCase();
    var sort = sortSelect.value;
    var filtered = items.filter(function (it) {
      if (activeCategory !== 'all' && it.category !== activeCategory) return false;
      if (!q) return true;
      return (it.title + ' ' + it.summary + ' ' + it.sourceName).toLowerCase().indexOf(q) !== -1;
    });
    filtered.sort(function (a, b) {
      if (sort === 'importance') return b.importance - a.importance || b.publishedAt.localeCompare(a.publishedAt);
      return b.publishedAt.localeCompare(a.publishedAt);
    });

    listEl.innerHTML = filtered.map(function (it) {
      var d = new Date(it.publishedAt);
      var dateStr = isNaN(d.getTime()) ? '' : d.toISOString().slice(0, 10);
      return '<a class="card" href="' + escapeHtml(it.url) + '" target="_blank" rel="noopener noreferrer">' +
        '<div class="meta">' +
          '<span class="badge">' + escapeHtml(labels[it.category] || it.category) + '</span>' +
          '<span class="stars">' + stars(it.importance) + '</span>' +
          '<span>' + escapeHtml(it.sourceName) + '</span>' +
          '<span>' + dateStr + '</span>' +
        '</div>' +
        '<h3>' + escapeHtml(it.title) + '</h3>' +
        '<p>' + escapeHtml(it.summary) + '</p>' +
      '</a>';
    }).join('');

    countEl.textContent = filtered.length + ' 件';
    emptyEl.style.display = filtered.length === 0 ? 'block' : 'none';
  }

  searchBox.addEventListener('input', render);
  sortSelect.addEventListener('change', render);
  chips.forEach(function (chip) {
    chip.addEventListener('click', function () {
      chips.forEach(function (c) { c.classList.remove('active'); });
      chip.classList.add('active');
      activeCategory = chip.dataset.category;
      render();
    });
  });

  render();
})();
</script>
</body>
