<style>
  :root {

  }

  }
  html[data-theme="light"] { --bg:#f7f8fb; --bg2:#ffffff; --card:#ffffff; --border:#e2e5ec; --text:#1b1f2a; --text2:#5a6072; --shadow: 0 4px 16px rgba(20,25,40,0.06); }
  html[data-theme="dark"] { --bg:#0f1117; --bg2:#161923; --card:#1a2035; --border:rgba(79,158,255,0.15); --text:#e8eaf6; --text2:#8892b0; --shadow: 0 8px 32px rgba(0,0,0,0.4); }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif; background: var(--bg); color: var(--text); min-height:100vh; }
  #app { max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; }
  header { padding: 16px 0 24px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  header h1 { font-size: clamp(1.3rem, 4vw, 1.8rem); }
  header p { color: var(--text2); font-size:0.85rem; margin-top:6px; }
  nav a { color: var(--accent); text-decoration:none; font-size:0.85rem; margin-right:12px; }
  #themeToggle { background: var(--card); border:1px solid var(--border); border-radius:8px; padding:6px 12px; cursor:pointer; color:var(--text); font-size:0.85rem; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  #searchBox { flex:1; min-width:180px; padding:9px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg2); color:var(--text); font-size:0.9rem; }
  select { padding:9px 10px; border-radius:8px; border:1px solid var(--border); background:var(--bg2); color:var(--text); font-size:0.9rem; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:20px; }
  .chip { padding:5px 12px; border-radius:999px; border:1px solid var(--border); background:var(--bg2); color:var(--text2); font-size:0.8rem; cursor:pointer; user-select:none; }
  .chip.active { background: var(--accent); border-color: var(--accent); color:#fff; }
  #count { color: var(--text2); font-size:0.82rem; margin-bottom:14px; }
  .card { display:block; background: var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:12px; box-shadow: var(--shadow); text-decoration:none; color:inherit; }
  .card .meta { display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:0.76rem; color: var(--text2); margin-bottom:6px; }
  .badge { background: rgba(61,107,255,0.12); color: var(--accent); padding:2px 8px; border-radius:6px; font-weight:600; }
  .stars { color:#f0c040; letter-spacing:1px; }
  .card h3 { font-size:1.02rem; margin-bottom:4px; line-height:1.4; }
  .card p { font-size:0.86rem; color: var(--text2); line-height:1.55; }
  #empty { text-align:center; color: var(--text2); padding: 40px 0; display:none; }
  footer { text-align:center; padding-top:24px; color: var(--text2); font-size:0.76rem; }
  .archive-list { list-style:none; }
  .archive-list li { margin-bottom:8px; }
  .archive-list a { color: var(--accent); text-decoration:none; font-size:0.95rem; }
</style>
</head>

<script>
(function () {
  var root = document.documentElement;
  var saved = localStorage.getItem('ainews_theme');
  if (saved) root.setAttribute('data-theme', saved);
  document.getElementById('themeToggle').addEventListener('click', function () {
    var current = root.getAttribute('data-theme')
      || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var next = current === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('ainews_theme', next);
  });

  var listEl = document.getElementById('newsList');
  if (!listEl) return;

  var items = JSON.parse(document.getElementById('news-data').textContent);
  var labels = JSON.parse(document.getElementById('category-labels').textContent);
  var searchBox = document.getElementById('searchBox');
  var sortSelect = document.getElementById('sortSelect');
  var chips = document.querySelectorAll('.chip');
  var countEl = document.getElementById('count');
  var emptyEl = document.getElementById('empty');
  var activeCategory = 'all';

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function stars(n) {
    return '★'.repeat(n) + '☆'.repeat(5 - n);
  }

  function render() {
    var q = searchBox.value.trim().toLowerCase();
    var sort = sortSelect.value;
    var filtered = items.filter(function (it) {
      if (activeCategory !== 'all' && it.category !== activeCategory) return false;
      if (!q) return true;
      return (it.title + ' ' + it.summary + ' ' + it.sourceName).toLowerCase().indexOf(q) !== -1;
    });
    filtered.sort(function (a, b) {
      if (sort === 'importance') return b.importance - a.importance || b.publishedAt.localeCompare(a.publishedAt);
      return b.publishedAt.localeCompare(a.publishedAt);
    });

    listEl.innerHTML = filtered.map(function (it) {
      var d = new Date(it.publishedAt);
      var dateStr = isNaN(d.getTime()) ? '' : d.toISOString().slice(0, 10);
      return '<a class="card" href="' + escapeHtml(it.url) + '" target="_blank" rel="noopener noreferrer">' +
        '<div class="meta">' +
          '<span class="badge">' + escapeHtml(labels[it.category] || it.category) + '</span>' +
          '<span class="stars">' + stars(it.importance) + '</span>' +
          '<span>' + escapeHtml(it.sourceName) + '</span>' +
          '<span>' + dateStr + '</span>' +
        '</div>' +
        '<h3>' + escapeHtml(it.title) + '</h3>' +
        '<p>' + escapeHtml(it.summary) + '</p>' +
      '</a>';
    }).join('');

    countEl.textContent = filtered.length + ' 件';
    emptyEl.style.display = filtered.length === 0 ? 'block' : 'none';
  }

  searchBox.addEventListener('input', render);
  sortSelect.addEventListener('change', render);
  chips.forEach(function (chip) {
    chip.addEventListener('click', function () {
      chips.forEach(function (c) { c.classList.remove('active'); });
      chip.classList.add('active');
      activeCategory = chip.dataset.category;
      render();
    });
  });

  render();
})();
</script>
</body>
